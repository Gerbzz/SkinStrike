name: SkinStrike creator draft verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/project-library-2026-10-15]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/creator-draft.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Test project and rendering logic
        shell: pwsh
        run: cargo test --locked
      - name: Test native editor logic
        shell: pwsh
        run: cargo test --locked --features native-ui
      - name: Build native editor and project CLI
        shell: pwsh
        run: cargo build --locked --features native-ui --bin skinstrike-ui --bin skinstrike
      - name: Bound and hash executables
        shell: pwsh
        run: |
          $exe = Get-Item target/debug/skinstrike-ui.exe
          if ($exe.Length -gt 120MB) { throw "Debug executable exceeds 120 MiB cap: $($exe.Length)" }
          $cli = Get-Item target/debug/skinstrike.exe
          if ($cli.Length -gt 64MB) { throw "CLI executable exceeds 64 MiB cap: $($cli.Length)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $cliSha = (Get-FileHash $cli.FullName -Algorithm SHA256).Hash
          @("$sha  skinstrike-ui.exe", "$cliSha  skinstrike.exe") | Set-Content artifact/SHA256.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: skinstrike-creator-draft
          path: |
            target/debug/skinstrike-ui.exe
            target/debug/skinstrike.exe
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 1
